<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenvolvimento de Interface - Aula 01</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Calculadora JavaScript</h1>
            <label for="numero1">Primeiro número:</label>
            <input type="number" id="numero1" placeholder="Digite um número">
            
            <label for="numero2">Segundo número:</label>
            <input type="number" id="numero2" placeholder="Digite um número">
            
            <button id="btnCalcular">Calcular</button>
            
            <div id="resultado" class="resultado" aria-live="polite">
                Os resultados aparecerão aqui.
            </div>
        </section>

        <section class="card">
            <h2>Calculadora de Média</h2>
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="0 a 10">
            
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="0 a 10">
            
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="0 a 10">
            
            <button id="calcular">Calcular Média</button>
            
            <div id="resultadoMedia" class="resultado" aria-live="polite">
                A média aparecerá aqui.
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
