<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula 3 - Classificador de resultados</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label, input, button { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; }
    input, button { padding: 8px; font-size: 1rem; }
    #mensagem { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; }
    .aprovado { background: #d4edda; color: #155724; }
    .recuperacao { background: #fff3cd; color: #856404; }
    .reprovado, .erro { background: #f8d7da; color: #721c24; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>Classificador de resultados</h1>

  <form id="formulario">
    <label for="nome">Nome do aluno</label>
    <input type="text" id="nome">

    <label for="nota1">Nota 1</label>
    <input type="number" id="nota1" min="0" max="10" step="0.1">

    <label for="nota2">Nota 2</label>
    <input type="number" id="nota2" min="0" max="10" step="0.1">

    <button type="submit">Classificar</button>
  </form>

  <div id="mensagem"></div>

  <h2>Histórico</h2>
  <ul id="lista"></ul>

  <script src="script.js"></script>
</body>
</html>
